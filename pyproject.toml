[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tls-fingerprint"
version = "0.1.0"
description = "Passive TLS fingerprinting (JA3/JA3S) for a Computer Networks course project"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
tls-fingerprint = "tls_fingerprint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
